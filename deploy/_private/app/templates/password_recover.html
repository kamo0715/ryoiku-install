{% extends "base.html" %}{% block title %}パスワード再設定{% endblock %}{% block content %}
<div class="center-card"><div class="eyebrow">ACCOUNT RECOVERY</div><h1>復旧コードでパスワードを再設定</h1>
<div class="notice warn"><p>職員の方は管理者へ再設定を依頼してください。管理者もログインできない場合、サーバー管理者がUbuntu上で一度限りの復旧コードを発行します。</p><p>復旧コードは15分間有効で、5回失敗すると無効になります。コードの発行にはサーバー管理権限が必要です。</p></div>
<form method="post" action="/password/recover" class="stack"><input type="hidden" name="_csrf" value="{{csrf}}">
<label>ユーザー名<input name="username" autocomplete="username" maxlength="80" required></label>
<label>復旧コード<input name="reset_code" autocomplete="off" maxlength="150" spellcheck="false" required></label>
<label>新しいパスワード<input name="new_password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label>
<label>新しいパスワード（確認）<input name="confirm_password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label>
<button class="primary full">新しいパスワードに再設定</button></form>
<p><a href="/login">ログイン画面に戻る</a></p></div>
{% endblock %}

{% extends "base.html" %}{% block title %}自分のパスワード変更{% endblock %}{% block content %}
<div class="center-card"><div class="eyebrow">ACCOUNT SECURITY</div><h1>自分のパスワード変更</h1>
<p class="muted">現在のパスワードを確認して変更します。変更後、ほかの端末を含むすべてのログインを無効化します。</p>
<form method="post" action="/account/password" class="stack"><input type="hidden" name="_csrf" value="{{csrf}}">
<label>現在のパスワード<input name="current_password" type="password" autocomplete="current-password" required></label>
<label>新しいパスワード<input name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><small>12文字以上（256文字以内）</small></label>
<label>新しいパスワード（確認）<input name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label>
<button class="primary full">パスワードを変更する</button></form>
<p><a href="/">戻る</a></p></div>
{% endblock %}

{% extends "base.html" %}{% block title %}ログイン{% endblock %}{% block content %}
<div class="center-card"><div class="eyebrow">SECURE STAFF ACCESS</div><h1>職員ログイン</h1>
<p class="muted">児童の支援情報を扱うため、職員アカウントでの認証が必要です。</p>
{% if success %}<div class="notice" role="status">{{success}}</div>{% endif %}
<form method="post" action="/login" class="stack"><input type="hidden" name="_csrf" value="{{csrf}}">
<label>ユーザー名<input name="username" id="username" required autocomplete="username" placeholder="staff01"></label>
<label>パスワード<input name="password" id="password" type="password" required autocomplete="current-password"></label>
<button class="primary full">ログイン</button></form><p class="muted"><a href="/password/recover">パスワードを忘れた場合（復旧コードで再設定）</a></p></div>{% endblock %}

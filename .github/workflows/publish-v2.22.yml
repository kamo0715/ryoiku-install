name: Build and publish v2.22 multi-curriculum daily flow

on:
  push:
    branches: [main]
    paths:
      - 'release-sources/v2.22/**'
      - 'docker-lan-v2.22/**'
      - 'scripts/build_v222_release.py'
      - '.github/workflows/publish-v2.22.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-ryoiku-v2.22
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13 for archived dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build and verify Lolipop full and patch ZIPs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assemble-v2.20.py
          python3 scripts/build_v222_release.py --out dist/v2.22
          (cd dist/v2.22 && sha256sum -c SHA256SUMS.txt)

      - name: Assemble exact v2.22 Docker application and run regressions
        shell: bash
        run: |
          set -euo pipefail
          cd docker-lan-v2.22
          ./prepare.sh
          test "$(cat upload_to_domain_root/_private/app/VERSION)" = '2.22'
          bash -n prepare.sh install-lan-test.sh remove-old-ryoiku.sh
          python3 -m py_compile upload_to_domain_root/_private/app/app.py docker/server.py build_bundle.py
          python3 tests_docker/test_multi_selection_from_builder.py
          python3 tests_docker/test_generate_to_day_flow.py
          python3 tests_docker/test_pdf_save.py
          python3 tests_docker/test_exports.py
          python3 tests_docker/test_remove_old.py
          python3 tests_docker/test_guard.py

      - name: Docker Engine build and LAN binding smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd docker-lan-v2.22
          ip4="$(ip -4 -o addr show dev "$(ip route show default | awk 'NR==1{for(i=1;i<=NF;i++)if($i=="dev")print $(i+1)}')" scope global | awk 'NR==1{split($4,a,"/");print a[1]}')"
          cidr="$(IP4="$ip4" python3 -c 'import os,ipaddress;print(ipaddress.ip_network(os.environ["IP4"]+"/24",strict=False))')"
          printf 'LAN_BIND_IP=%s\nLAN_ALLOWED_CIDR=%s\nRYOIKU_PORT=19180\n' "$ip4" "$cidr" > .env
          docker compose config -q
          docker compose up -d --build
          trap 'docker compose logs --tail=60 || true; docker compose down || true' EXIT
          for i in $(seq 1 50); do
            if curl --noproxy '*' -fsS "http://${ip4}:19180/healthz";then break;fi
            sleep 2
          done
          curl --noproxy '*' -fsS "http://${ip4}:19180/first-setup" | grep -q '初回管理者登録'
          curl --noproxy '*' -fsS "http://${ip4}:19180/static/generate_multi_select.js" | grep -q 'curriculum-multi-form'
          docker compose exec -T ryoiku python3 -c 'import app; assert app.app.title'
          docker compose ps

      - name: Build Docker ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 docker-lan-v2.22/build_bundle.py --output dist/v2.22/ryoiku-v2.22-docker-lan-test.zip
          (cd dist/v2.22 && sha256sum ryoiku-v2.22-docker-lan-test.zip >> SHA256SUMS.txt)
          (cd dist/v2.22 && sha256sum -c SHA256SUMS.txt)

      - name: Publish v2.22 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base=dist/v2.22
          if gh release view v2.22 --repo "$GH_REPO" >/dev/null 2>&1;then
            for f in "$base"/*.zip "$base"/SHA256SUMS.txt;do
              name="$(basename "$f")"
              if gh release view v2.22 --repo "$GH_REPO" --json assets --jq '.assets[].name' | grep -Fxq "$name";then
                echo "Preserving existing v2.22 asset $name"
              else
                gh release upload v2.22 "$f" --repo "$GH_REPO"
              fi
            done
          else
            gh release create v2.22 "$base"/*.zip "$base"/SHA256SUMS.txt \
              --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title 'Ryoiku v2.22 — select multiple curricula for one day' \
              --notes-file "$base/RELEASE_NOTES.md"
          fi
          gh release view v2.22 --repo "$GH_REPO" --json assets --jq '.assets[].name'

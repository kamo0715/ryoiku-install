name: Build and publish v2.25 student handoff records

on:
  push:
    branches: [main]
    paths:
      - 'release-sources/v2.25/**'
      - 'docker-lan-v2.25/**'
      - 'scripts/build_v225_release.py'
      - '.github/workflows/publish-v2.25.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-ryoiku-v2.25
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build verified v2.25 Lolipop complete and patch archives
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/assemble-v2.20.py
          python3 scripts/build_v224_release.py --out dist/.v224-for-v225
          python3 scripts/build_v225_release.py --out dist/v2.25 --base-archive dist/.v224-for-v225/ryoiku_lolipop_v2_24_ftp_full.zip
          (cd dist/v2.25 && sha256sum -c SHA256SUMS.txt)

      - name: Assemble v2.25 Docker source and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd docker-lan-v2.25
          ./prepare.sh
          test "$(cat upload_to_domain_root/_private/app/VERSION)" = '2.25'
          bash -n prepare.sh install-lan-test.sh remove-old-ryoiku.sh
          python3 -m py_compile upload_to_domain_root/_private/app/app.py upload_to_domain_root/_private/app/storage.py docker/server.py build_bundle.py
          python3 tests_docker/test_handoff.py
          python3 tests_docker/test_support_drafts_and_mobile_ui.py
          python3 tests_docker/test_batch_new_generation.py
          python3 tests_docker/test_multi_selection_from_builder.py
          python3 tests_docker/test_generate_to_day_flow.py
          python3 tests_docker/test_pdf_save.py
          python3 tests_docker/test_exports.py
          python3 tests_docker/test_guard.py
          python3 tests_docker/test_remove_old.py
          cmp docker/overrides/support_form.html upload_to_domain_root/_private/app/templates/support_form.html
          cmp upload_to_domain_root/_private/app/static/app.css upload_to_domain_root/static/app.css

      - name: Test real Docker Engine and LAN-only binding
        shell: bash
        run: |
          set -euo pipefail
          cd docker-lan-v2.25
          netif="$(ip route show default | awk 'NR==1{for(i=1;i<=NF;i++)if($i=="dev")print $(i+1)}')"
          ip4="$(ip -4 -o addr show dev "$netif" scope global | awk 'NR==1{split($4,a,"/");print a[1]}')"
          cidr="$(IP4="$ip4" python3 -c 'import os,ipaddress;print(ipaddress.ip_network(os.environ["IP4"]+"/24",strict=False))')"
          printf 'LAN_BIND_IP=%s\nLAN_ALLOWED_CIDR=%s\nRYOIKU_PORT=19195\n' "$ip4" "$cidr" > .env
          docker compose config -q
          docker compose up -d --build
          trap 'docker compose logs --tail=100 || true; docker compose down || true' EXIT
          ready=0
          for i in $(seq 1 50); do
            if curl --noproxy '*' -fsS "http://${ip4}:19195/healthz";then ready=1;break;fi
            sleep 2
          done
          test "$ready" -eq 1
          curl --noproxy '*' -fsS "http://${ip4}:19195/first-setup" -o "$RUNNER_TEMP/ryoiku-initial.html"
          grep -Fq '初回管理者登録' "$RUNNER_TEMP/ryoiku-initial.html"
          docker compose exec -T ryoiku grep -Fq '引き継ぎ情報' /opt/ryoiku/app/templates/child.html
          docker compose exec -T ryoiku grep -Fq '更新内容を保存する' /opt/ryoiku/app/templates/handoff.html
          docker compose exec -T ryoiku python3 -c 'import app,storage; assert app.app.title; assert hasattr(storage,"add_handoff")'
          docker compose ps

      - name: Build Docker ZIP and verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          python3 docker-lan-v2.25/build_bundle.py --output dist/v2.25/ryoiku-v2.25-docker-lan-test.zip
          (cd dist/v2.25 && sha256sum ryoiku-v2.25-docker-lan-test.zip >> SHA256SUMS.txt)
          (cd dist/v2.25 && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY_VERIFY'
          from zipfile import ZipFile
          path='dist/v2.25/ryoiku-v2.25-docker-lan-test.zip'
          with ZipFile(path) as z:
              assert z.testzip() is None
              root='ryoiku-v2.25-docker-lan-test/'
              assert z.read(root+'upload_to_domain_root/_private/app/VERSION').strip()==b'2.25'
              assert '引き継ぎ情報'.encode() in z.read(root+'upload_to_domain_root/_private/app/templates/handoff.html')
          PY_VERIFY

      - name: Publish Release v2.25 without replacing existing archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base=dist/v2.25
          if gh release view v2.25 --repo "$GH_REPO" >/dev/null 2>&1;then
            for path in "$base"/*.zip "$base"/SHA256SUMS.txt;do
              name="$(basename "$path")"
              if gh release view v2.25 --repo "$GH_REPO" --json assets --jq '.assets[].name' | grep -Fxq "$name";then
                echo "Keeping existing v2.25 asset: $name"
              else
                gh release upload v2.25 "$path" --repo "$GH_REPO"
              fi
            done
          else
            gh release create v2.25 "$base"/*.zip "$base"/SHA256SUMS.txt \
              --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title 'Ryoiku v2.25 — student handoff records separate from curricula' \
              --notes-file "$base/RELEASE_NOTES.md"
          fi
          gh release view v2.25 --repo "$GH_REPO" --json assets --jq '.assets[].name'
